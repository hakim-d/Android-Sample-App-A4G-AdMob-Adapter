plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Google's sample AdMob App ID: works with Google test ad units.
def GOOGLE_SAMPLE_APP_ID = "ca-app-pub-3940256099942544~3347511713"

// Private values live in the git-ignored local.properties (this repo is public):
//   a4g.admobAppId=ca-app-pub-...~...   AdMob App ID for the classic flavor (release builds)
//   a4g.storeFile / a4g.storePassword / a4g.keyAlias / a4g.keyPassword   release signing
// -Pa4g.admobAppId=... on the command line overrides local.properties.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def CLASSIC_APP_ID = project.findProperty("a4g.admobAppId") ?: localProps.getProperty("a4g.admobAppId") ?: GOOGLE_SAMPLE_APP_ID

android {
    namespace "com.hakim_ma.a4g"
    compileSdk 36

    defaultConfig {
        minSdk 23
        targetSdk 36
        versionCode 8
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // One codebase, two installable APKs. The classic Google Mobile Ads SDK and the GMA Next-Gen
    // SDK never ship together: all SDK code lives in src/classic or src/nextgen behind AdEngine.
    flavorDimensions += "sdk"
    productFlavors {
        classic {
            dimension "sdk"
            // Same package as the published sample app, so this ships as an update to that listing.
            applicationId "com.hakim_ma.a4g"
            minSdk 23
            def appId = CLASSIC_APP_ID
            manifestPlaceholders = [admobAppId: appId]
            buildConfigField "String", "ADMOB_APP_ID", "\"${appId}\""
            buildConfigField "boolean", "RUNTIME_APP_ID", "false"
            resValue "string", "app_name", "A4G Tester · Classic"
        }
        nextgen {
            dimension "sdk"
            applicationId "com.ad4game.tester.nextgen"
            minSdk 24 // ads-mobile-sdk requires 24
            manifestPlaceholders = [admobAppId: GOOGLE_SAMPLE_APP_ID]
            buildConfigField "String", "ADMOB_APP_ID", "\"${GOOGLE_SAMPLE_APP_ID}\""
            buildConfigField "boolean", "RUNTIME_APP_ID", "true"
            resValue "string", "app_name", "A4G Tester · Next-Gen"
        }
    }

    // Release signing comes from local.properties (gitignored; this repo is public):
    //   a4g.storeFile=/Users/you/a4gkey
    //   a4g.storePassword=...
    //   a4g.keyAlias=key0
    //   a4g.keyPassword=...
    def hasReleaseKey = localProps.getProperty('a4g.storeFile') != null

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(localProps.getProperty('a4g.storeFile'))
                storePassword localProps.getProperty('a4g.storePassword')
                keyAlias localProps.getProperty('a4g.keyAlias', 'key0')
                keyPassword localProps.getProperty('a4g.keyPassword')
            }
        }
    }

    buildTypes {
        // "My ad units" (a publisher's live units inside this package) stays out of the Play build:
        // their units belong to their own app, so serving is unreliable and can trigger AdMob's
        // "Apps to confirm" review on their account. Debug/internal builds keep it for support work.
        debug {
            // Hidden for now in every build; flip to "true" to bring "My ad units" back.
            buildConfigField "boolean", "PUBLISHER_UNITS", "false"
        }
        release {
            buildConfigField "boolean", "PUBLISHER_UNITS", "false"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    testImplementation 'junit:junit:4.13.2'

    // Classic flavor: Google Mobile Ads SDK + the Ad4Game classic adapter.
    classicImplementation 'com.google.android.gms:play-services-ads:24.1.0'
    // Next-Gen flavor: GMA Next-Gen SDK + the Ad4Game Next-Gen adapter.
    nextgenImplementation 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.6.0'

    // Always build against the newest published Ad4Game adapters (resolved from
    // github.com/ad4game/a4g-admob maven-metadata.xml). The resolved versions are shown in the app.
    classicImplementation 'com.Ad4game:admobmanager:latest.release'
    nextgenImplementation 'com.Ad4game:admobmanager-nextgen:latest.release'
}

// Fail the build if the legacy SDK sneaks onto the Next-Gen classpath.
configurations.configureEach { conf ->
    if (conf.name.startsWith('nextgen') && conf.name.endsWith('RuntimeClasspath')) {
        conf.incoming.afterResolve { ResolvableDependencies deps ->
            def legacy = deps.resolutionResult.allComponents.collect { it.moduleVersion }.findAll {
                it != null && it.group == 'com.google.android.gms' &&
                        it.name.startsWith('play-services-ads') &&
                        it.name != 'play-services-ads-identifier'
            }
            if (!legacy.isEmpty()) {
                throw new GradleException("Legacy GMA SDK on ${conf.name}: ${legacy}")
            }
        }
    }
}
