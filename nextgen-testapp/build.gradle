// Test app reproducing the client setup: GMA Next-Gen SDK only, no play-services-ads,
// R8 minified release build, with the Ad4Game Next-Gen adapter.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ad4game.nextgentest'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ad4game.nextgentest'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Debug key so the R8 build can be installed on the emulator.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Client's setup: Next-Gen SDK 1.6.0 (adapter declares 1.5.0; must resolve upward).
    implementation 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.6.0'
    implementation 'com.Ad4game:admobmanager-nextgen:1.0.0'
}

// Fail the build if the legacy SDK sneaks onto the classpath.
configurations.configureEach { conf ->
    if (conf.name.endsWith('RuntimeClasspath')) {
        conf.incoming.afterResolve { ResolvableDependencies deps ->
            def legacy = deps.resolutionResult.allComponents.collect { it.moduleVersion }.findAll {
                it != null && it.group == 'com.google.android.gms' &&
                        it.name.startsWith('play-services-ads') &&
                        it.name != 'play-services-ads-identifier'
            }
            if (!legacy.isEmpty()) {
                throw new GradleException("Legacy GMA SDK on ${conf.name}: ${legacy}")
            }
        }
    }
}
